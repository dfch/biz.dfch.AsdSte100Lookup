name: Pylint and unittest

on: [push, pull_request]

jobs:
  build:
    env:
      # Opt-in to Node 24 to avoid Node 20 deprecation warnings (effective June 2026).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
    - name: Checkout
      # uses: actions/checkout@v5
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

    - name: Set up Python
      # uses: actions/setup-python@v6
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      # uses: astral-sh/setup-uv@v5 v5.2.1
      uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca
      with:
        enable-cache: true

    - name: Verify tools 1
      run: |
        uv --version
        uv run --frozen python --version

    - name: Install dependencies
      run: |
        uv sync --frozen --python "${{ matrix.python-version }}" --extra dev --extra build

    - name: Verify tools 2
      run: |
        uv run --frozen ruff --version
        uv run --frozen pylint --version

    - name: Examine code with ruff
      run: |
        uv run --frozen ruff format src --check # NOSONAR
        uv run --frozen ruff check src  # NOSONAR

    - name: Examine code with pylint
      run: |
        uv run --frozen pylint $(git ls-files '*.py') || true

    - name: Run unit tests
      run: |
        uv run --frozen python -m unittest discover -v -s tests -t . -p "test_*.py"
